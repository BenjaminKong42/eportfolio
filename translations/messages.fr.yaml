about.who_title: "Qui suis-je ?"
about.who_p1: >
  Je m’appelle Benjamin Kong et je suis étudiant en première année de BUT Réseaux et Télécommunications
  à l’IUT de Roanne. Passionné par les technologies et l’informatique, j’aime approfondir mes connaissances
  et découvrir de nouveaux domaines liés au numérique.

about.who_p2: >
  En dehors de mes études, je suis quelqu’un de motivé et dynamique, appréciant le travail en équipe
  ainsi que les défis. Mes centres d’intérêt reflètent ma curiosité et mon envie constante de progresser.

